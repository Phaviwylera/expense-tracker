name: Build and test Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check parser and dashboard calculations
        run: |
          node --check app/src/main/assets/app.js
          node tests/ui-test.cjs
          mkdir -p /tmp/pocket-tests
          javac -d /tmp/pocket-tests app/src/main/java/in/pocketledger/app/SmsParser.java app/src/main/java/in/pocketledger/app/MerchantRules.java tests/ParserTest.java
          java -cp /tmp/pocket-tests ParserTest
      - name: Compile APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PocketLedger-debug.apk
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-debug-apk
          path: PocketLedger-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android-smoke.sh
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-launch-evidence
          path: smoke-output/
          if-no-files-found: ignore
